name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The recorded snapshot is the population baseline for the refresh check.
      # A failed refresh stops the run and leaves the last deployment online.
      - run: mkdir -p data && cp test/fixtures/aa-snapshot-2026-10-28.json data/
      - run: bun run refresh
      - run: bun run build
      - run: mkdir -p site && cp dist/opifex.html site/index.html && cp dist/elbows.md site/elbows.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
